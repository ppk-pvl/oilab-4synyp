const navItems=[['home','Басты бет','home'],['tasks','Зерттеу миссиялары','grid'],['method','5 қадам әдісі','steps'],['teacher','Мұғалім кабинеті','teacher'],['about','Платформа туралы','info']];
const guideNames=['Байқа','Белгіле','Дәлелде','Түзет','Қорытындыла'];
const guideDesc=['ЖИ жауабын бағала','Күмәнді пікірді анықта','Дерекпен салыстыр','Дұрыс жауапты таңда','Не үйренгеніңді жаз'];
let data={progress:load(storageKey,{}),custom:load(customKey,[])};
let state={page:'home',active:null,run:null,revealed:false};
let currentToastTimer;
function load(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(data.progress));localStorage.setItem(customKey,JSON.stringify(data.custom));}catch{toast('Бұл браузерде сақтау шектелген. Жұмыс уақытша жалғасады.')}}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(currentToastTimer);currentToastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function allTasks(){return [...tasks,...data.custom]}
function getTask(id){return allTasks().find(x=>x.id===id)}
function completeCount(){return allTasks().filter(t=>data.progress[t.id]?.completedAt).length}
function getScore(){return allTasks().reduce((acc,t)=>acc+(Number(data.progress[t.id]?.score)||0),0)}
function formatDate(iso){if(!iso)return '—';try{return new Date(iso).toLocaleDateString('kk-KZ')}catch{return '—'}}
function navTo(page){state.page=page;state.active=null;state.run=null;state.revealed=false;render();window.scrollTo({top:0,behavior:'instant'})}
function begin(id){const t=getTask(id);if(!t)return;state.active=id;state.page='mission';state.revealed=false;state.run={step:0,selected:-1,feedback:null,firstWrong:false,score:0,notes:'',method:''};render();window.scrollTo({top:0,behavior:'instant'})}
function updateChrome(){const done=completeCount();const total=allTasks().length;document.getElementById('side-score').textContent=`${done} / ${total} миссия`;document.getElementById('side-fill').style.width=`${total?done/total*100:0}%`;document.getElementById('breadcrumb').textContent='ОйLAB / '+({home:'Басты бет',tasks:'Миссиялар',method:'5 қадам әдісі',teacher:'Мұғалім кабинеті',about:'Платформа туралы',mission:getTask(state.active)?.title||'Миссия'}[state.page]||'Басты бет');document.getElementById('navigation').innerHTML=navItems.map(([id,label,icon])=>`<button class="nav-item ${state.page===id||(state.page==='mission'&&id==='tasks')?'active':''}" data-action="nav" data-id="${id}" ${state.page===id?'aria-current="page"':''}>${ico(icon,18)} <span>${E(label)}</span></button>`).join('')}
function render(){updateChrome();const main=document.getElementById('content');let content;switch(state.page){case 'home':content=renderHome();break;case 'tasks':content=renderTasks();break;case 'method':content=renderMethod();break;case 'teacher':content=renderTeacher();break;case 'about':content=renderAbout();break;case 'mission':content=renderMission();break;default:content=renderHome()}main.innerHTML=content;}
function missionCard(t,idx){const p=data.progress[t.id];return `<article class="mission-card"><div class="mission-top"><div class="mission-emoji ${E(t.color||'blue')}">${E(t.emoji)}</div><span class="mini-tag ${p?.completedAt?'done':''}">${p?.completedAt?'✓ Аяқталды':t.type==='custom'?'Өз тапсырмаң':'Зерттеу миссиясы'}</span></div><div class="mission-number">МИССИЯ ${String(idx+1).padStart(2,'0')}</div><h3>${E(t.title)}</h3><p class="mission-desc">${E(t.desc)}</p><div class="card-footer"><div><div class="card-subject">${E(t.subject)}</div>${p?.completedAt?`<div class="small-progress">${p.score==null?'Өзіндік тексеру':p.score+'/8 ұпай'} · дайын</div>`:''}</div><button class="card-open" data-action="begin" data-id="${E(t.id)}" aria-label="${E(t.title)} миссиясын ашу">${ico('arrow',18)}</button></div></article>`}
function scoreStats(){const total=allTasks().length;const done=completeCount();const pct=total?Math.round(done/total*100):0;return `<div class="stats"><div class="stat"><div class="stat-icon">${ico('grid',22)}</div><div><div class="stat-label">Барлық миссия</div><div class="stat-value">${total} <span>тапсырма</span></div></div></div><div class="stat"><div class="stat-icon green">${ico('check',23)}</div><div><div class="stat-label">Аяқталды</div><div class="stat-value">${done} <span>/ ${total}</span></div></div></div><div class="stat"><div class="stat-icon gold">${ico('chart',22)}</div><div><div class="stat-label">Орындалу көрсеткіші</div><div class="stat-value">${pct}<span>%</span></div></div></div></div>`}
function framework(){return `<div class="framework"><h3>🔎 Зерттеушінің 5 қадамы</h3><div class="steps">${guideNames.map((name,i)=>`<div class="step"><span class="step-number">${i+1}</span><span>${name}</span></div>`).join('')}</div></div>`}
function renderHome(){const next=allTasks().find(t=>!data.progress[t.id]?.completedAt)||allTasks()[0];return `<section class="hero"><div class="hero-copy"><div class="hero-kicker">✧ БОЛАШАҚТЫҢ ЗЕРТТЕУШІСІ</div><h1>ЖИ айтты екен деп,<br>бірден сенбе!</h1><p>Ақпаратты тексеруді үйрен: қателікті тап, дәлел келтір, өз жауабыңды құрастыр. Сен — ақпарат детективісің!</p><div class="hero-actions"><button class="btn btn-light" data-action="begin" data-id="${E(next.id)}">${ico('spark',16)} Миссияны бастау ${ico('arrow',16)}</button><button class="btn btn-outline-white" data-action="nav" data-id="method">5 қадаммен танысу</button></div></div><div class="hero-art" aria-hidden="true"><div class="orb"><div class="ai-face"><span>AI</span></div></div><div class="float-chip one">🔍 Тексер!</div><div class="float-chip two">💡 Дәлелде</div><div class="float-chip three">✓ Өз ойың</div></div></section>${scoreStats()}<div class="section-head"><div><h2>Зерттеу миссиялары</h2><p>Әр тапсырмада ЖИ жауабын тексерудің 5 кезеңінен өтесің.</p></div><button class="link-btn" data-action="nav" data-id="tasks">Барлығын көру →</button></div><section class="mission-grid">${allTasks().slice(0,6).map((t,i)=>missionCard(t,i)).join('')}</section>${framework()}`}
function renderTasks(){const arr=allTasks();return `<div class="page-kicker">${ico('grid',16)} ОҚУ ЖАТТЫҒУЛАРЫ</div><h1 class="page-title">Ақпарат детективтері</h1><p class="page-sub">Жауапты жай ғана жаттама — күмәндан, тексер, қорытынды жаса. 24 интерактивті тапсырма дайын. Әр миссияда ЖИ жауабын бес қадаммен тексересің.</p><div class="section-head"><h2>Миссиялар картасы</h2><span class="pill">${completeCount()} / ${arr.length} аяқталды</span></div><div class="mission-grid">${arr.map((t,i)=>missionCard(t,i)).join('')}</div>${framework()}`}
function guideSidebar(step,task){return `<div class="guide-card"><h3>Менің тексеру жолым</h3><ol class="guide-list">${guideNames.map((x,i)=>`<li class="${i<step?'complete':i===step?'active':''}"><span class="small-dot">${i<step?ico('check',13):i+1}</span><span>${E(x)}</span></li>`).join('')}</ol></div><div class="guide-card"><h3>💡 Зерттеушіге кеңес</h3><p class="muted" style="font-size:12px;margin:0">${E(task.tip||'ЖИ жауабын тексеру үшін дәлел ізде.')}</p></div><div class="guide-card"><h3>Жинаған ұпай</h3><div class="score-big">${state.run?.score||0}<span class="muted" style="font-size:13px"> / 8</span></div><div class="track"><span style="width:${((state.run?.score||0)/8*100)}%"></span></div><p style="font-size:11px;color:#8c9bad;margin:10px 0 0">Бұл — жаттығудың ойын ұпайы. Зерттеу диагностикасы бөлек бағаланады.</p></div>`}
function renderMission(){const t=getTask(state.active);if(!t)return `<div class="panel">Миссия табылмады. <button data-action="nav" data-id="tasks" class="btn btn-primary">Тапсырмаларға оралу</button></div>`;const r=state.run;if(!r)return renderResults(t);if(t.type==='custom')return renderCustomRun(t);const n=r.step;const block=n===5?renderResults(t):n===4?renderReflection(t,r):renderQuizStep(t,r);return `<div class="lesson-header"><button class="back-btn" data-action="nav" data-id="tasks" aria-label="Миссияларға қайту">${ico('back',19)}</button><div><span class="eyebrow">${E(t.subject)} · ${n<5?'5 ҚАДАМНЫҢ '+(n+1)+'-І':'Миссия аяқталды'}</span><h1>${E(t.title)}</h1></div></div><div class="lesson-layout"><div class="lesson-body"><div class="lesson-steps">${guideNames.map((_,i)=>`<div class="lesson-segment ${i<n?'passed':i===n?'current':''}"></div>`).join('')}</div>${block}</div><div class="lesson-sidebar">${guideSidebar(n,t)}</div></div>`}
function renderQuizStep(t,r){const s=t.checks[r.step],checked=r.feedback,chosen=r.selected;return `<div class="panel"><div class="eyebrow">${r.step+1}-қадам · ${E(guideNames[r.step])}</div><h2 class="lesson-stage">${E(guideDesc[r.step])}</h2><p class="lesson-intro">Келесі сұраққа ойлан. Дұрыс емес жауап таңдасаң, қайта көруге болады.</p><div class="ai-message"><div class="ai-title"><span class="ai-circle">🤖</span> ЖИ жауабы <span class="ai-corner">Жаттығу үлгісі</span></div><p class="muted" style="font-size:12px;margin:0 0 8px">Сұрақ: ${E(t.prompt)}</p><p class="ai-text">«${E(t.ai)}»</p></div>${r.step===2?`<div class="source-box"><b>📖 Тексеруге арналған дерек</b>${E(t.source)}</div>`:''}<div class="task-q">${E(s.q)}</div><div class="options" role="group" aria-label="Жауап нұсқалары">${s.opts.map((opt,i)=>`<button type="button" class="option ${chosen===i?'selected':''} ${checked==='correct'&&i===s.correct?'good':''} ${checked==='incorrect'&&chosen===i?'bad':''}" data-action="choose" data-index="${i}" ${checked==='correct'?'disabled':''} aria-pressed="${chosen===i?'true':'false'}"><span class="circle">${chosen===i?'✓':String.fromCharCode(65+i)}</span><span>${E(opt)}</span></button>`).join('')}</div>${checked?`<div class="feedback ${checked==='correct'?'success':'error'}" role="status"><div style="font-size:20px">${checked==='correct'?'✅':'🧐'}</div><div><strong>${checked==='correct'?'Жарайсың, дұрыс!':'Қайта ойланып көр.'}</strong><div>${E(checked==='correct'?s.why:'Бұл нұсқа сәйкес келмейді. Жауап пен дәлелді қайта салыстыр.')}</div></div></div>`:''}<div class="footer-actions"><span class="progress-note">${r.step+1} / 5 кезең</span>${checked==='correct'?`<button class="btn btn-primary" data-action="next">Келесі қадам ${ico('arrow',16)}</button>`:`<button class="btn btn-primary" data-action="check" ${chosen<0?'disabled':''}>Жауапты тексеру ${ico('check',16)}</button>`}</div></div>`}
function renderReflection(t,r){return `<div class="panel"><div class="eyebrow">5-қадам · Қорытындыла</div><h2 class="lesson-stage">Өз ойыңмен аяқта!</h2><p class="lesson-intro">Өзіңнің қай тексеру тәсілін қолданғаныңды айт. Мұнда дұрыс немесе қате жауап жоқ.</p><div class="source-box"><b>✅ Тексерілген нұсқа</b>${E(t.model)}</div><div style="margin-top:19px" class="field"><label for="methodSelect">Қай тәсіл саған көбірек көмектесті?</label><select class="select" id="methodSelect"><option value="">Таңда...</option><option value="Есептеп тексердім">🧮 Есептеп тексердім</option><option value="Дерекпен салыстырдым">📖 Дерекпен салыстырдым</option><option value="Картамен немесе күнтізбемен тексердім">🗺️ Картамен / күнтізбемен тексердім</option><option value="Қарсы мысал таптым">🔎 Қарсы мысал таптым</option><option value="Пікір мен фактіні ажыраттым">💭 Пікір мен фактіні ажыраттым</option></select></div><div class="field"><label for="reflectText">Бүгін қандай қорытынды жасадың? <span class="muted">(міндетті емес)</span></label><textarea class="textarea" id="reflectText" placeholder="Мысалы: Мен жауапты есеппен тексердім. ЖИ қателесуі мүмкін...">${E(r.notes)}</textarea></div><div class="footer-actions"><div class="warning-box">🛡️ Жеке ақпаратыңды жазба.</div><button class="btn btn-teal" data-action="finish">Миссияны аяқтау ${ico('check',16)}</button></div></div>`}
function finishQuiz(){const r=state.run,t=getTask(state.active);if(!r||r.step!==4)return;const method=document.getElementById('methodSelect').value;const notes=document.getElementById('reflectText').value.trim();if(!method){toast('Алдымен тексеру тәсілін таңда.');document.getElementById('methodSelect').focus();return}const prev=data.progress[t.id];data.progress[t.id]={score:Math.max(r.score,prev?.score||0),lastScore:r.score,completedAt:new Date().toISOString(),method,notes,attempts:(prev?.attempts||0)+1};save();state.run=null;render();window.scrollTo({top:0,behavior:'smooth'})}

function renderCustomRun(t){if(state.revealed){return `<div class="lesson-header"><button class="back-btn" data-action="nav" data-id="tasks">${ico('back',18)}</button><h1>${E(t.title)}</h1></div><div class="panel"><div class="eyebrow">МҰҒАЛІМНІҢ ҮЛГІ ЖАУАБЫ</div><h2 class="lesson-stage">Өз жауабыңды салыстыр</h2><div class="source-box"><b>📖 Дәлел</b>${E(t.source)}</div><div class="reveal"><strong>✅ Дұрыс жауап үлгісі</strong><p style="margin:8px 0 0">${E(t.model)}</p></div><div class="warning-box" style="margin-top:15px">Бұл тапсырманың бағасын мұғалім рубрика бойынша қояды. Сайт мәтінді автоматты бағаламайды.</div><div class="footer-actions"><span class="muted" style="font-size:12px">Өз жауабыңды шынайы салыстыр.</span><button class="btn btn-teal" data-action="finish-custom">Салыстырдым, аяқтау ${ico('check',16)}</button></div></div>`}return `<div class="lesson-header"><button class="back-btn" data-action="nav" data-id="tasks">${ico('back',18)}</button><div><span class="eyebrow">МҰҒАЛІМ ҚОСҚАН ТАПСЫРМА</span><h1>${E(t.title)}</h1></div></div><div class="lesson-layout"><div class="lesson-body"><div class="panel"><div class="ai-message"><div class="ai-title"><span class="ai-circle">🤖</span> ЖИ үлгі жауабы</div><div class="muted" style="font-size:12px">Сұрақ: ${E(t.prompt)}</div><p class="ai-text">«${E(t.ai)}»</p></div><div class="answer-grid"><div class="field"><label for="custom1">1. Қай тұсы күмәнді?</label><textarea id="custom1" class="textarea" placeholder="Күмән тудырған сөйлемді белгіле..."></textarea></div><div class="field"><label for="custom2">2. Қандай дәлел керек?</label><textarea id="custom2" class="textarea" placeholder="Оқулық, ереже немесе дерек..."></textarea></div><div class="field"><label for="custom3">3. Өзің қалай түзетер едің?</label><textarea id="custom3" class="textarea" placeholder="Дұрыс жауапты өз сөзіңмен жаз..."></textarea></div></div><div class="footer-actions"><span class="muted" style="font-size:12px">Мұғаліммен бірге тексер</span><button class="btn btn-primary" data-action="reveal-custom">Үлгімен салыстыру ${ico('arrow',16)}</button></div></div></div><div class="lesson-sidebar"><div class="guide-card"><h3>🔎 Тексеру алгоритмі</h3><ol class="guide-list">${guideNames.map((x,i)=>`<li><span class="small-dot">${i+1}</span>${E(x)}</li>`).join('')}</ol></div><div class="tip-box">Мұғалім енгізген тапсырманың мәтінін сайт автоматты түрде бағаламайды.</div></div></div>`}
function renderMethod(){const methodData=[['👀','Байқа','ЖИ берген жауапты мұқият оқы. Бұл дұрыс па, күмән бар ма?'],['🔍','Белгіле','Тексеретін нақты сөзді, санды немесе тұжырымды тап.'],['📚','Дәлелде','Оқулық, карта, күнтізбе, ереже немесе есеппен салыстыр.'],['✏️','Түзет','Қатені өз сөзіңмен дұрыстап жаз.'],['💡','Қорытындыла','Қай дәлел көмектескенін түсіндір, келесі жолы не тексеретініңді айт.']];return `<div class="page-kicker">${ico('steps',15)} СЫНИ ОЙЛАУ ӘДІСІ</div><h1 class="page-title">ЖИ жауабын тексерудің 5 қадамы</h1><p class="page-sub">Бұл — әр миссияны орындаудың басты алгоритмі. «Байқау – салыстыру – дәлелдеу – түзету – қорытындылау» үлгісіне сай жасалған.</p><div class="method-cards">${methodData.map(([emoji,name,desc],i)=>`<div class="method-card"><span class="method-num">ҚАДАМ ${i+1}</span><span class="method-icon">${emoji}</span><strong>${E(name)}</strong><p>${E(desc)}</p></div>`).join('')}</div><div class="two-col section-margin"><div class="panel"><span class="eyebrow">БІР МЫСАЛ</span><h2 style="margin:6px 0 17px;font-size:21px">ЖИ қателессе не істейміз?</h2><div class="comparison"><div class="compare-box"><strong>🤖 ЖИ ЖАУАБЫ</strong><p>«Бір аптада 8 күн бар».</p></div><div class="compare-box correct"><strong>✅ ТЕКСЕРІЛГЕН ЖАУАП</strong><p>«Бір аптада 7 күн бар».</p></div></div><p class="text-block"><strong>Дәлел:</strong> дүйсенбі, сейсенбі, сәрсенбі, бейсенбі, жұма, сенбі, жексенбі — барлығы 7 күн. ЖИ сенімді сөйлеуі мүмкін, бірақ жауапты нақты дерекпен тексереміз.</p><button class="btn btn-primary" data-action="begin" data-id="math">Миссия орындап көру ${ico('arrow',16)}</button></div><div class="panel"><span class="eyebrow">ЗЕРТТЕУШІ ЕРЕЖЕСІ</span><h2 style="margin:6px 0 16px;font-size:21px">Дәлел табудың 4 жолы</h2><div class="lesson-plan"><div class="plan-row"><div class="plan-num">01</div><div><strong>Есептеп тексер</strong><p>Амалдарды өзің орында немесе кері амал жаса.</p></div></div><div class="plan-row"><div class="plan-num">02</div><div><strong>Оқулыққа қара</strong><p>Ереже, сурет, анықтамамен салыстыр.</p></div></div><div class="plan-row"><div class="plan-num">03</div><div><strong>Карта мен күнтізбені аш</strong><p>Орын, күн немесе ай туралы деректі тексер.</p></div></div><div class="plan-row"><div class="plan-num">04</div><div><strong>Қарсы мысал ізде</strong><p>«Барлығы», «әрқашан» сөздеріне мән бер.</p></div></div></div></div></div><div class="callout"><span style="font-size:27px">🛡️</span><p><strong>Қауіпсіз жұмыс:</strong> оқушылар сайттағы дайын мысалдармен жұмыс істейді. Жеке мәлімет, пароль немесе басқа құпия ақпарат енгізудің қажеті жоқ. Бұл сайт сыртқы ЖИ сервисіне қосылмайды.</p></div>`}
function renderTeacher(){const done=completeCount();const teacherMissions=allTasks();const rows=teacherMissions.map(t=>{const v=data.progress[t.id];return `<div class="bar-row"><span title="${E(t.title)}">${E(t.title)}</span><div class="bar-outer"><div class="bar-inner" style="width:${t.type==='custom'?(v?.completedAt?100:0):((v?.score||0)/8*100)}%"></div></div><strong>${v?.completedAt?(v.score==null?'✓':v.score+'/8'):'—'}</strong></div>`}).join('');return `<div class="page-kicker">${ico('teacher',16)} ПЕДАГОГИКАЛЫҚ ҚҰРАЛДАР</div><h1 class="page-title">Мұғалім кабинеті</h1><p class="page-sub">Сабақ жоспарын қолданыңыз, тапсырма қосыңыз және осы браузердегі орындалу нәтижесін қараңыз.</p><section class="teacher-hero"><div><h2>🧠 Сыни ойлау зертханасын басқарыңыз</h2><p>Мұнда дайын ЖИ-үлгі жауаптарымен жұмыс ұйымдастырылады. Нәтижелер сыныптық эксперимент деректері емес; олар тек осы құрылғыда сақталған жаттығулардың көрсеткіші.</p></div><span class="teacher-hero-icon">👩‍🏫</span></section><div class="teacher-grid"><div class="panel"><div class="section-head"><div><h2 style="font-size:18px">Орындалу көрсеткіші</h2><p>${done} тапсырма аяқталған · осы браузерде</p></div>${ico('chart',23)}</div>${rows||'<div class="empty">Әзірге нәтиже жоқ</div>'}<div class="footer-actions"><button class="btn btn-outline btn-sm" data-action="export">${ico('download',15)} CSV жүктеу</button><button class="btn btn-danger btn-sm" data-action="reset">${ico('trash',14)} Нәтижелерді өшіру</button></div></div><div class="panel"><h2 style="font-size:18px;margin:0 0 15px">8 балдық бағалау рубрикасы</h2><div class="table-wrap"><table class="rubric"><thead><tr><th>Критерий</th><th>0 балл</th><th>1 балл</th><th>2 балл</th></tr></thead><tbody><tr><td><strong>Қатені байқау</strong></td><td>Таппады</td><td>Көмекпен</td><td>Өзі тапты</td></tr><tr><td><strong>Дерекпен салыстыру</strong></td><td>Салыстырмады</td><td>Толық емес</td><td>Дұрыс салыстырды</td></tr><tr><td><strong>Дәлел келтіру</strong></td><td>Жоқ</td><td>Әлсіз</td><td>Нақты</td></tr><tr><td><strong>Жауапты түзету</strong></td><td>Қате</td><td>Жартылай</td><td>Толық дұрыс</td></tr></tbody></table></div><div class="tip-box" style="margin-top:14px">Бұл рубрика — мұғалімнің бастапқы және қорытынды диагностиканы бағалауына арналған. Ойын ұпайымен автоматты түрде теңестірілмейді.</div><button class="btn btn-outline btn-sm" style="margin-top:14px" data-action="print-rubric">${ico('print',15)} Рубриканы басып шығару</button></div></div><div class="teacher-grid section-margin"><div class="panel"><h2 style="font-size:19px;margin:0 0 6px">Тапсырма құрастыру студиясы</h2><p class="muted" style="font-size:12px;margin:0 0 18px">Өз пәніңізге сай ЖИ-үлгі жауабын енгізіп, оқушыларға өз сөздерімен түзетуді ұсыныңыз.</p><form id="teacherForm" class="form-grid"><div class="field"><label for="addTitle">Тапсырма атауы *</label><input class="text-input" id="addTitle" name="title" maxlength="90" placeholder="Мысалы: Есептің жауабын тексер" required></div><div class="field"><label for="addSubject">Пән</label><select class="select" id="addSubject" name="subject"><option>Математика</option><option>Жаратылыстану</option><option>Дүниетану</option><option>Қазақ тілі</option><option>Басқа пән</option></select></div><div class="field span-2"><label for="addPrompt">Сұрақ *</label><input class="text-input" id="addPrompt" name="prompt" maxlength="250" placeholder="Оқушыға қойылатын сұрақ" required></div><div class="field span-2"><label for="addAI">ЖИ-дің үлгі жауабы *</label><textarea class="textarea" id="addAI" name="ai" maxlength="700" placeholder="Әдейі тексеруге арналған жауапты енгізіңіз" required></textarea></div><div class="field span-2"><label for="addSource">Тексеруге арналған дерек / ереже *</label><textarea class="textarea" id="addSource" name="source" maxlength="700" placeholder="Мұғалім ұсынатын сенімді дерек" required></textarea></div><div class="field span-2"><label for="addModel">Дұрыс жауап үлгісі *</label><textarea class="textarea" id="addModel" name="model" maxlength="700" placeholder="Қате түзетілген жауап" required></textarea></div><div class="span-2"><button class="btn btn-primary btn-full" type="submit">${ico('edit',17)} Жаңа тапсырманы қосу</button></div></form>${data.custom.length?`<div class="separator"></div><h3 style="font-size:13px">Мен қосқан тапсырмалар (${data.custom.length})</h3>${data.custom.map(t=>`<div class="plan-row" style="align-items:center"><div class="plan-num">✦</div><div style="flex:1"><strong>${E(t.title)}</strong><p>${E(t.subject)}</p></div><button class="btn btn-danger btn-sm" data-action="delete-custom" data-id="${E(t.id)}" aria-label="${E(t.title)} тапсырмасын өшіру">${ico('trash',14)}</button></div>`).join('')}`:''}</div><div class="panel"><h2 style="font-size:19px;margin:0 0 6px">6 сабаққа арналған жоспар</h2><p class="muted" style="font-size:12px;margin:0 0 16px">24 тапсырма 6 сабаққа бөлінген: әр сабақта 4 қысқа миссия. Мұғалім оқушылардың деңгейіне қарай ретін өзгерте алады.</p><div class="lesson-plan"><div class="plan-row"><span class="plan-num">1</span><div><small>МАТЕМАТИКА · 1-САБАҚ</small><strong>Арифметикалық амалдар</strong><p>Қосу, азайту, көбейту және бөлуді тексеру.</p></div></div><div class="plan-row"><span class="plan-num">2</span><div><small>МАТЕМАТИКА · 2-САБАҚ</small><strong>Өлшем және геометрия</strong><p>Күнтізбе, периметр, бөлшек және уақыт.</p></div></div><div class="plan-row"><span class="plan-num">3</span><div><small>ЖАРАТЫЛЫСТАНУ · 3-САБАҚ</small><strong>Тіршілік және табиғат</strong><p>Балықтар, су күйлері, пингвин және өсімдік.</p></div></div><div class="plan-row"><span class="plan-num">4</span><div><small>ЖАРАТЫЛЫСТАНУ · 4-САБАҚ</small><strong>Табиғи құбылыстар</strong><p>Күн мен түн, су айналымы, қоректік тізбек, Ай.</p></div></div><div class="plan-row"><span class="plan-num">5</span><div><small>ҚАЗАҚ ТІЛІ · 5-САБАҚ</small><strong>Сөз мағынасы мен сөз табы</strong><p>Пікір, синоним, антоним және сын есім.</p></div></div><div class="plan-row"><span class="plan-num">6</span><div><small>ҚАЗАҚ ТІЛІ ЖӘНЕ ДҮНИЕТАНУ · 6-САБАҚ</small><strong>Сөйлем және географиялық дерек</strong><p>Тыныс белгісі, факт пен пікір, астана және материк.</p></div></div></div><div class="tip-box" style="margin-top:17px"><b>Сыныпта қолдану:</b> бір миссияға 5–10 минут бөліңіз. Оқушыларды алдымен өздігінен ойлантып, кейін жұппен дәлелдеуге бағыттаңыз.</div></div></div>`}
function renderAbout(){return `<div class="page-kicker">${ico('info',16)} ЖОБА ТУРАЛЫ</div><h1 class="page-title">ОйLAB — ақылды жауап емес, ақылды тексеру</h1><p class="page-sub">4-сынып оқушыларының жасанды интеллект жауабын тексеру арқылы сыни ойлау дағдысын дамытуға арналған оқу-әдістемелік интерактивті платформа.</p><div class="two-col"><div class="panel"><div class="eyebrow">ЖОБАНЫҢ МАҚСАТЫ</div><h2 style="font-size:23px;margin:8px 0">Жауапты тексеретін ойлау дағдысын қалыптастыру</h2><p class="text-block">Оқушы дайын жауапты қабылдап қана қоймай, нақты тұжырымды анықтайды, оқулыққа, ережеге, картаға немесе есепке жүгінеді, дәлел келтіреді және қатені түзетеді. Оқыту моделінің негізі — бес қадамды алгоритм және деңгейлеп берілген практикалық тапсырмалар.</p><div class="separator"></div><div class="page-kicker">${ico('shield',15)} МАҢЫЗДЫ ШЕКТЕУЛЕР</div><p class="text-block">Сайттағы «ЖИ жауабы» — мұғалім алдын ала дайындаған <strong>жаттығу мәтіні</strong>. Нақты уақытта жауап жасайтын жасанды интеллект моделі немесе сыртқы API қолданылмайды. Оқушының тапсырма нәтижесі <strong>тек осы браузерде</strong> сақталады. Бірнеше құрылғының нәтижесін ортақ базаға жинау қарастырылмаған.</p></div><div class="panel"><h2 style="font-size:20px;margin:0 0 16px">Платформаның мүмкіндіктері</h2><div class="lesson-plan"><div class="plan-row"><span class="plan-num">01</span><div><strong>24 интерактивті миссия</strong><p>Математика, жаратылыстану, дүниетану және қазақ тілі бойынша.</p></div></div><div class="plan-row"><span class="plan-num">02</span><div><strong>Бес сатылы тексеру</strong><p>Байқау, белгілеу, дәлелдеу, түзету, қорытынды.</p></div></div><div class="plan-row"><span class="plan-num">03</span><div><strong>Кері байланыс және ұпай</strong><p>Әр жауапқа бірден түсіндірме беріледі.</p></div></div><div class="plan-row"><span class="plan-num">04</span><div><strong>Мұғалім тапсырмалары</strong><p>Еркін мәтінді тексеру карточкаларын қосу.</p></div></div><div class="plan-row"><span class="plan-num">05</span><div><strong>CSV есеп және офлайн жұмыс</strong><p>Жетістіктерді осы құрылғыдан көруге және сақтауға болады.</p></div></div></div></div></div><div class="callout"><span style="font-size:27px">🎓</span><p><strong>Курстық жұмыс тақырыбы:</strong> «4-сыныпта жасанды интеллект жауабын тексеру арқылы оқушылардың сыни ойлауын қалыптастыру». Бұл прототип практикалық бөлімге арналған оқу құралы ретінде жасалды. Шынайы педагогикалық нәтиже туралы тұжырым жасау үшін сабақта бағалау және талдау жүргізу қажет.</p></div>`}
function download(name,text,mime){const blob=new Blob([text],{type:mime});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['Тапсырма','Пән','Нәтиже (8 балл)','Аяқталған күні','Тексеру тәсілі','Қайталау саны'],...allTasks().map(t=>{const p=data.progress[t.id]||{};return [t.title,t.subject,p.score??'',formatDate(p.completedAt),p.method||'',p.attempts||0]})];const text=rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');download('OyLAB_natzheler.csv','\ufeff'+text,'text/csv;charset=utf-8');toast('CSV файл сақтауға дайын.')}
function printRubric(){const before=state.page;state.page='teacher';render();window.print();state.page=before}
function printMission(id){const t=getTask(id);if(!t)return;const html=`<html lang="kk"><head><meta charset="utf-8"><title>${E(t.title)} — Жұмыс парағы</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:36px auto;line-height:1.55;color:#1e3654}h1{font-size:23px}h2{font-size:15px;margin-top:26px}.ai{border:1px solid #bfc9d9;padding:15px;border-radius:9px;background:#f5f7fb}.line{height:56px;border-bottom:1px dashed #a2aab5}.note{font-size:12px;color:#657287}header{display:flex;justify-content:space-between;border-bottom:2px solid #1b4c8d;padding-bottom:12px}.footer{border-top:1px solid #ddd;margin-top:30px;padding-top:10px;font-size:11px}</style></head><body><header><b>ОйLAB · 4-сынып</b><span>${E(t.subject)}</span></header><h1>Жұмыс парағы: ${E(t.title)}</h1><p>Аты-жөні: ___________________________________ Күні: __________</p><div class="ai"><b>Сұрақ:</b> ${E(t.prompt)}<p><b>ЖИ жауабы:</b> «${E(t.ai)}»</p></div>${['1. Қай сөйлем күмәнді?','2. Қай дерекпен салыстырдың?','3. Қандай дәлел келтіресің?','4. Дұрыс жауапты жаз.','5. Қорытынды: бүгін нені түсіндің?'].map(x=>`<h2>${x}</h2><div class="line"></div>`).join('')}<div class="footer">Ақпаратты оқы → белгіле → салыстыр → түзет → қорытындыла. Мұғалімге арналған дұрыс жауап: ${E(t.model)}</div></body></html>`;const win=window.open('','_blank');if(!win){toast('Браузер қалқымалы терезені бұғаттады.');return}win.document.open();win.document.write(html);win.document.close();win.focus();setTimeout(()=>win.print(),250)}
function saveCustomTask(form){const fd=new FormData(form);const obj=Object.fromEntries(fd.entries());for(const key of ['title','prompt','ai','source','model'])if(!String(obj[key]||'').trim()){toast('Міндетті жолдардың бәрін толтырыңыз.');return}const id='custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);data.custom.push({id,type:'custom',subject:String(obj.subject||'Басқа пән'),title:String(obj.title).trim(),prompt:String(obj.prompt).trim(),ai:String(obj.ai).trim(),source:String(obj.source).trim(),model:String(obj.model).trim(),desc:'Мұғалім құрастырған тексеру тапсырмасы.',emoji:'🧩',color:'purple',tip:'Дерекке сүйеніп, дұрыс жауапты өз сөзіңмен жаз.'});save();render();toast('Тапсырма қосылды. Миссиялар бөлімінен ашуға болады.')}
function handleAction(btn){const action=btn.dataset.action,id=btn.dataset.id;switch(action){case 'nav':navTo(id);break;case 'begin':begin(id);break;case 'choose':{const r=state.run;if(!r||r.step>=4||r.feedback==='correct')break;r.selected=Number(btn.dataset.index);r.feedback=null;render();break}case 'check':{const r=state.run,t=getTask(state.active);if(!r||r.step>=4||r.selected<0||!t)break;const s=t.checks[r.step];if(r.selected===s.correct){r.feedback='correct';r.score+=r.firstWrong?1:2}else{r.feedback='incorrect';r.firstWrong=true}render();break}case 'next':{const r=state.run;if(!r||r.feedback!=='correct')break;r.step++;r.selected=-1;r.feedback=null;r.firstWrong=false;render();break}case 'finish':finishQuiz();break;case 'reveal-custom':{const inputs=['custom1','custom2','custom3'].map(x=>document.getElementById(x)?.value?.trim());if(inputs.some(v=>!v)){toast('Алдымен үш өріске де өз жауабыңды жаз.');break}state.revealed=true;render();break}case 'finish-custom':{const t=getTask(state.active);const prev=data.progress[t.id];data.progress[t.id]={score:null,completedAt:new Date().toISOString(),method:'Мұғаліммен өзіндік тексеру',attempts:(prev?.attempts||0)+1};save();state.run=null;state.revealed=false;navTo('tasks');toast('Тапсырма аяқталды!');break}case 'export':exportCSV();break;case 'reset':if(confirm('Осы браузерде сақталған барлық оқу нәтижелерін өшіресіз бе? Мұғалім қосқан тапсырмалар сақталады.')){data.progress={};save();render();toast('Оқу нәтижелері тазартылды.')}break;case 'print':printMission(id);break;case 'print-rubric':window.print();break;case 'delete-custom':if(confirm('Осы тапсырманы өшіру керек пе?')){data.custom=data.custom.filter(t=>t.id!==id);delete data.progress[id];save();render();toast('Тапсырма өшірілді.')}break;default:break}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled){handleAction(btn)}});
document.addEventListener('submit',e=>{if(e.target.id==='teacherForm'){e.preventDefault();saveCustomTask(e.target)}});
render();
</script>
</body>
</html>
